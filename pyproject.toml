[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncroom"
version = "0.2.0"
description = "Play the Mac's audio on Sonos, Google Home and Bluetooth speakers at once, time-aligned."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soxr", "lameenc", "soco", "pychromecast", "sounddevice"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
app = ["rumps", "py2app"]

[project.scripts]
syncroom = "syncroom.cli:main"

[tool.setuptools]
packages = ["syncroom"]

[tool.setuptools.package-data]
syncroom = ["static/*"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "BLE", "SIM"]


[tool.pytest.ini_options]
testpaths = ["tests"]
